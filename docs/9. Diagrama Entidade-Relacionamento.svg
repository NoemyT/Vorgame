<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Diagrama entidade-relacionamento do Vorgame</title>
  <desc id="descricao">Cada combinação de usuário e jogo admite uma avaliação. Avaliacao.jogoId referencia o ID local de Jogo. Os jogos externos têm uma chave única composta por provedor e idExterno.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #152b43; }
    .titulo { font-size: 23px; font-weight: 700; }
    .entidade { font-size: 17px; font-weight: 700; fill: #fff; }
    .campo { font-size: 13px; }
    .legenda { font-size: 12px; fill: #385573; }
    .chave { font-weight: 700; }
    .tabela { fill: #fff; stroke: #8ca5c0; }
    .cabecalho { fill: #214d79; }
    .relacao { stroke: #214d79; stroke-width: 1.75; }
  </style>
  <rect width="1040" height="540" fill="#f6f9fc"/>
  <text x="24" y="40" class="titulo">Vorgame · Modelo de dados</text>

  <path d="M 264,168 H 345 M 635,168 H 716" fill="none" class="relacao"/>
  <text x="274" y="154" class="legenda">1</text>
  <text x="312" y="154" class="legenda">0..*</text>
  <text x="646" y="154" class="legenda">0..*</text>
  <text x="700" y="154" class="legenda">1</text>

  <g transform="translate(24 67)">
    <rect width="240" height="205" rx="8" class="tabela"/>
    <path d="M 0,37 V 8 Q 0,0 8,0 H 232 Q 240,0 240,8 V 37 Z" class="cabecalho"/>
    <text x="14" y="25" class="entidade">Usuario</text>
    <g class="campo" transform="translate(14 59)">
      <text y="0" class="chave">id · INT · PK</text>
      <text y="24">nome · VARCHAR(191)</text>
      <text y="48">email · VARCHAR(254) · UQ</text>
      <text y="72">username · VARCHAR(191) · UQ</text>
      <text y="96">senhaHash · VARCHAR(255)</text>
      <text y="120">criadoEm · DATETIME(3)</text>
    </g>
  </g>

  <g transform="translate(345 67)">
    <rect width="290" height="274" rx="8" class="tabela"/>
    <path d="M 0,37 V 8 Q 0,0 8,0 H 282 Q 290,0 290,8 V 37 Z" class="cabecalho"/>
    <text x="14" y="25" class="entidade">Avaliacao</text>
    <g class="campo" transform="translate(14 59)">
      <text y="0" class="chave">id · INT · PK</text>
      <text y="24">usuarioId · INT · FK → Usuario.id</text>
      <text y="48">jogoId · INT · FK → Jogo.id</text>
      <text y="72">nota · INT</text>
      <text y="96">criadoEm · DATETIME(3)</text>
      <text y="120">atualizadoEm · DATETIME(3)</text>
      <text y="144">UQ (usuarioId, jogoId)</text>
      <text y="168">Índice (jogoId)</text>
    </g>
  </g>

  <g transform="translate(716 67)">
    <rect width="300" height="352" rx="8" class="tabela"/>
    <path d="M 0,37 V 8 Q 0,0 8,0 H 292 Q 300,0 300,8 V 37 Z" class="cabecalho"/>
    <text x="14" y="25" class="entidade">Jogo</text>
    <g class="campo" transform="translate(14 59)">
      <text y="0" class="chave">id · INT · PK</text>
      <text y="24">titulo · VARCHAR(191)</text>
      <text y="48">capa · VARCHAR(2048)</text>
      <text y="72">descricao · TEXT</text>
      <text y="96">genero · VARCHAR(191)</text>
      <text y="120">plataformas · JSON</text>
      <text y="144">mediaAvaliacao · DECIMAL(3,1) · NULL</text>
      <text y="168">totalAvaliacoes · INT · padrão 0</text>
      <text y="192">chaveSeed · VARCHAR(191) · UQ · NULL</text>
      <text y="216">provedor · VARCHAR(32) · NULL</text>
      <text y="240">idExterno · BIGINT UNSIGNED · NULL</text>
      <text y="264">UQ (provedor, idExterno)</text>
    </g>
  </g>

  <text x="24" y="464" class="legenda">PK = chave primária autoincremental · FK = chave estrangeira · UQ = restrição de unicidade</text>
  <text x="24" y="488" class="legenda">Avaliacao.jogoId referencia o ID local. O par de campos externos identifica os jogos da IGDB.</text>
  <text x="24" y="512" class="legenda">Nos jogos do seed, a chaveSeed identifica o registro e os campos de identidade externa ficam nulos.</text>
</svg>
